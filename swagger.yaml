openapi: 3.0.3
info:
  title: eCommerce API
  version: 1.0.0
  description: Backend API for users, categories, products, and orders.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        "200":
          description: API status

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        "200":
          description: List of users
    post:
      tags:
        - Users
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
        "400":
          description: Validation or duplicate email error

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User found
        "404":
          description: User not found
    put:
      tags:
        - Users
      summary: Update a user by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: User updated
        "400":
          description: Validation or duplicate email error
        "404":
          description: User not found
    delete:
      tags:
        - Users
      summary: Delete a user by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found

  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      responses:
        "200":
          description: List of categories
    post:
      tags:
        - Categories
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
        "400":
          description: Validation or duplicate category error

  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Get a category by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Category found
        "404":
          description: Category not found
    put:
      tags:
        - Categories
      summary: Update a category by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateInput"
      responses:
        "200":
          description: Category updated
        "400":
          description: Validation or duplicate category error
        "404":
          description: Category not found
    delete:
      tags:
        - Categories
      summary: Delete a category by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Category deleted
        "404":
          description: Category not found

  /products:
    get:
      tags:
        - Products
      summary: Get all products
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
          required: false
          description: Filter products by category id
      responses:
        "200":
          description: List of products
    post:
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
        "400":
          description: Validation or invalid category error

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get a product by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product found
        "404":
          description: Product not found
    put:
      tags:
        - Products
      summary: Update a product by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateInput"
      responses:
        "200":
          description: Product updated
        "400":
          description: Validation or invalid category error
        "404":
          description: Product not found
    delete:
      tags:
        - Products
      summary: Delete a product by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found

  /orders:
    get:
      tags:
        - Orders
      summary: Get all orders
      responses:
        "200":
          description: List of orders
    post:
      tags:
        - Orders
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
        "400":
          description: Validation or integrity error

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get an order by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Order found
        "404":
          description: Order not found
    put:
      tags:
        - Orders
      summary: Update an order by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateInput"
      responses:
        "200":
          description: Order updated
        "400":
          description: Validation or integrity error
        "404":
          description: Order not found
    delete:
      tags:
        - Orders
      summary: Delete an order by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Order deleted
        "404":
          description: Order not found

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    UserInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string

    UserUpdateInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CategoryUpdateInput:
      type: object
      properties:
        name:
          type: string

    ProductInput:
      type: object
      required:
        - name
        - price
        - categoryId
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        categoryId:
          type: string

    ProductUpdateInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        categoryId:
          type: string

    OrderProductInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1

    OrderInput:
      type: object
      required:
        - userId
        - products
      properties:
        userId:
          type: string
        products:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderProductInput"

    OrderUpdateInput:
      type: object
      properties:
        userId:
          type: string
        products:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderProductInput"
